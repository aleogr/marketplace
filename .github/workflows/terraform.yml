name: Terraform

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Applies are never cancelled, and neither are plans: both take the state
# lock, and a cancelled run can leave that lock behind.
concurrency:
  group: terraform-${{ github.ref }}
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "true"
  # Terraform reads TF_VAR_<name> for the variable of that name. The project
  # id and the state bucket are repository variables rather than values in
  # this repository, so moving an environment to another project changes a
  # setting instead of a commit (docs/infrastructure.md).
  TF_VAR_project_id: ${{ vars.GCP_PROJECT_ID }}
  TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}

jobs:
  validate:
    name: Format and validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@v7

      - name: Read the pinned Terraform release
        id: release
        run: echo "version=$(cat .terraform-version)" >> "$GITHUB_OUTPUT"

      # Third-party actions are pinned to a commit, not to a tag: a tag can be
      # moved onto different code, and this workflow's repository holds a
      # federation that can change the GCP project.
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ steps.release.outputs.version }}
          terraform_wrapper: false

      - name: Format
        run: terraform fmt -check -recursive

      # No backend and no credentials: this job answers whether the
      # configuration is well-formed, which is a question about the files.
      - name: Initialise without the backend
        run: terraform init -backend=false -input=false

      - name: Validate
        run: terraform validate

  plan:
    name: Plan the lab
    needs: validate
    # A plan needs the federation, and the federation issues credentials only
    # to a token minted for this repository. A pull request from a fork gets
    # no such token, and Dependabot's token is read-only, so the job is
    # skipped there rather than failing on an authentication it cannot have.
    # It is for that reason not a required check; "Format and validate" is.
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@v7

      - name: Read the pinned Terraform release
        id: release
        run: echo "version=$(cat .terraform-version)" >> "$GITHUB_OUTPUT"

      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_TERRAFORM_SA }}

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ steps.release.outputs.version }}
          terraform_wrapper: false

      - name: Initialise
        run: |
          terraform init -input=false -lock-timeout=5m \
            -backend-config=lab/backend.hcl \
            -backend-config="bucket=${TF_STATE_BUCKET}"

      - name: Plan
        id: plan
        run: |
          set +e
          terraform plan -input=false -lock-timeout=5m -no-color \
            -detailed-exitcode -var-file=lab/lab.tfvars -out=tfplan
          code=$?
          set -e
          case "$code" in
            0) echo "changes=false" >> "$GITHUB_OUTPUT" ;;
            2) echo "changes=true" >> "$GITHUB_OUTPUT" ;;
            *) exit "$code" ;;
          esac
          terraform show -no-color tfplan > plan.txt

      # One comment per pull request, rewritten on every run, so what it says
      # is the plan for the commit under review and not for an earlier one.
      - name: Comment the plan on the pull request
        uses: actions/github-script@v9
        env:
          HAS_CHANGES: ${{ steps.plan.outputs.changes }}
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- terraform-plan-lab -->';
            const limit = 60000;

            let body;
            if (process.env.HAS_CHANGES === 'true') {
              let plan = fs.readFileSync('infra/terraform/plan.txt', 'utf8');
              if (plan.length > limit) {
                plan = plan.slice(0, limit) +
                  '\n\n[truncated; the whole plan is in the job log]';
              }
              body = `${marker}\n### Terraform plan — lab\n\n` +
                '<details><summary>Show the plan</summary>\n\n' +
                '```terraform\n' + plan + '\n```\n\n</details>';
            } else {
              body = `${marker}\n### Terraform plan — lab\n\n` +
                'No changes. The lab matches this configuration.';
            }

            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(
              github.rest.issues.listComments, { owner, repo, issue_number });
            const previous = comments.find(
              (c) => c.user.type === 'Bot' && (c.body || '').startsWith(marker));

            if (previous) {
              await github.rest.issues.updateComment(
                { owner, repo, comment_id: previous.id, body });
            } else {
              await github.rest.issues.createComment(
                { owner, repo, issue_number, body });
            }

  apply:
    name: Apply to the lab
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@v7

      - name: Read the pinned Terraform release
        id: release
        run: echo "version=$(cat .terraform-version)" >> "$GITHUB_OUTPUT"

      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_TERRAFORM_SA }}

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ steps.release.outputs.version }}
          terraform_wrapper: false

      - name: Initialise
        run: |
          terraform init -input=false -lock-timeout=5m \
            -backend-config=lab/backend.hcl \
            -backend-config="bucket=${TF_STATE_BUCKET}"

      # THE INSTANCE IS DESIGNED TO SLEEP FOUR WEEKNIGHTS (aleogr/lab,
      # docs/lab.md is the authority for whether that schedule is already in
      # effect), and every resource this applies against it — the database,
      # the users — fails when it is stopped. Without this step that arrives
      # as a 400 from the Cloud SQL API in the middle of an apply; with it, it
      # arrives as a sentence. This check is here and not in deploy.yml
      # because deploy.yml never runs against a Terraform failure: it
      # triggers on `workflow_run` from this workflow and only
      # `if: ... == 'success'`, so stopping the apply also stops the
      # deployment that would otherwise follow it. One check does both jobs'
      # refusing.
      #
      # `cloudsql.instances.get` is part of the sqlTenant role this job already
      # holds. Starting the instance is NOT: that is cloudsql.instances.update,
      # which the role withholds on purpose, and which is the same permission
      # that would let this repository stop the instance other projects share.
      # So this step reads and refuses; it does not wake anything, and it does
      # not ask to.
      - name: Refuse to apply against a sleeping instance
        run: |
          # `set -o pipefail`: this step's shell is GitHub's `bash -e`, which
          # has no pipefail by default. Without it, a `lab.tfvars` that stops
          # matching the grep below would make `shared` an empty string
          # silently — `grep` fails, `sed` still exits 0 on empty input, and
          # `$()` swallows the failing exit code because it is not the last
          # command in the pipe. `-e` alone does not catch that; pipefail does.
          set -o pipefail

          # THE HONEST MESSAGE BELOW WAS DEAD CODE, found in re-review and
          # fixed here. `shared=$(cmd | cmd)` is a plain assignment; under
          # `-e` plus `pipefail`, a pipeline that fails inside it stops the
          # script AT THE ASSIGNMENT, before any line after it runs — so the
          # `if [ -z "$shared" ]` this used to be, and its message, never
          # executed. An unmatched `lab.tfvars` exited 1 with no output at
          # all, verified. `if ! shared=$(...); then` tests the assignment's
          # own exit status without tripping `-e`, so the message it guards
          # can actually print.
          if ! shared=$(grep -E '^\s*shared_project_id\s*=' lab/lab.tfvars \
            | sed -E 's/.*"([^"]+)".*/\1/'); then
            echo "::error::Could not read shared_project_id from" \
              "lab/lab.tfvars — the grep/sed above matched nothing. This" \
              "step cannot tell which project holds the shared instance, so" \
              "it refuses rather than guessing."
            exit 1
          fi

          # A SEPARATE CASE FROM THE ONE ABOVE: the pipeline can succeed
          # (`grep` matched a line) and still hand back an empty string, if
          # the matched line's quotes were empty. That is not a pipeline
          # failure, so the `if !` above does not catch it; this does.
          if [ -z "$shared" ]; then
            echo "::error::lab/lab.tfvars matched shared_project_id but the" \
              "captured value is empty. This step cannot tell which project" \
              "holds the shared instance, so it refuses rather than guessing."
            exit 1
          fi

          state=$(gcloud sql instances describe lab-postgres \
            --project="$shared" --format='value(settings.activationPolicy)')
          echo "activationPolicy=$state"

          # An empty answer is not evidence the instance is stopped — it
          # means this step could not read the instance's state at all (a
          # transient API error, a permission problem, a renamed instance),
          # and the two cases call for different messages: one says what was
          # read, the other says nothing could be.
          if [ -z "$state" ]; then
            echo "::error::gcloud returned no activationPolicy for" \
              "lab-postgres in $shared. That is not the same as the instance" \
              "being stopped — it means this step could not read the" \
              "instance's state, and refuses to apply against an unknown one."
            exit 1
          fi

          if [ "$state" != "ALWAYS" ]; then
            echo "::error::The shared instance lab-postgres is stopped" \
              "(activationPolicy=$state). It sleeps Monday to Thursday," \
              "22:00 to 07:30 local (aleogr/lab, docs/lab.md). Nothing is" \
              "wrong with this commit; re-run this workflow after the" \
              "instance starts."
            exit 1
          fi

      - name: Apply
        run: |
          terraform apply -input=false -lock-timeout=5m -no-color \
            -auto-approve -var-file=lab/lab.tfvars
