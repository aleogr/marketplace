name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Build, lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        run: make build

      - name: Toolchain consistency, vet, staticcheck, lint, gosec, govulncheck
        run: make check

      - name: Unit and integration tests
        run: make test

  integration:
    name: Integration tests
    runs-on: ubuntu-latest

    # A real PostgreSQL of the version the design names, not a fake and not an
    # in-memory stand-in: the things these tests check — migrations,
    # transactions, and later row-level security — are the database's
    # behaviour, and only the database has it (docs/design.md, section 2.8).
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: marketplace
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Run the integration tests
        run: make integration
        env:
          # Given an address, the suite uses it instead of starting a cluster
          # of its own (internal/platform/dbtest).
          TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/marketplace?sslmode=disable

  e2e:
    name: End-to-end tests
    runs-on: ubuntu-latest

    # The identity flows write, so the suite needs the same PostgreSQL the
    # integration tests get (e2e/database.py).
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: marketplace
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: e2e/requirements.txt

      - name: Install the suite
        run: |
          pip install -r e2e/requirements.txt
          playwright install --with-deps chromium

      - name: Run the suite
        run: make e2e
        env:
          # Given an address, the suite creates its database there instead of
          # starting a cluster of its own (e2e/database.py).
          TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/marketplace?sslmode=disable

      - name: Keep the screenshots as evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-screenshots
          path: e2e/screenshots/
          if-no-files-found: ignore

  secrets:
    name: Secret detection
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Third-party actions are pinned to a commit, not to a tag: a tag can be
      # moved onto different code, and from F3 this workflow's repository holds
      # a federation that can deploy to the GCP project.
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  image:
    name: Image build and scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build the image
        run: docker build --build-arg VERSION=${{ github.sha }} -t marketplace:${{ github.sha }} .

      - name: Scan the image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: marketplace:${{ github.sha }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH
