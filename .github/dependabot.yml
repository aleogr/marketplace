version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      go-dependencies:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: pip
    directory: /e2e
    schedule:
      interval: weekly
    groups:
      e2e-dependencies:
        patterns: ["*"]
    ignore:
      # Each Playwright release is built against one exact Chromium revision,
      # and the cloud environment ships a single preinstalled one it does not
      # replace, so a bump leaves a session with no browser to drive. CI cannot
      # catch it, because the runner downloads whichever revision its Playwright
      # asks for. This entry is the only thing holding the pin, and it also
      # silences security updates for this package, which runs in tests and
      # never in production. Remove it when the environment image moves to a
      # newer Chromium: `make e2e` reports the revision it finds.
      - dependency-name: playwright

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly

  # Keeps the provider constraint in infra/terraform/versions.tf moving, and
  # with it the lock file. The Terraform release itself is in
  # infra/terraform/.terraform-version, which no ecosystem here can see.
  - package-ecosystem: terraform
    directory: /infra/terraform
    schedule:
      interval: weekly
    groups:
      terraform-providers:
        patterns: ["*"]
