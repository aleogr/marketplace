version: "2"

linters:
  default: standard
  enable:
    - bodyclose      # an unclosed response body leaks a connection per request
    - errorlint      # comparisons that break once an error is wrapped
    - gocritic
    - misspell
    - noctx          # a request without a context cannot be cancelled or timed out
    - nolintlint     # a //nolint without a reason is a silent exception
    - revive
    - unconvert
    - unparam
  settings:
    misspell:
      # The documentation in docs/ is written in British English; code comments
      # follow it so that one repository does not hold two spellings.
      locale: UK
      ignore-rules:
        # Go's own identifiers: context.Canceled, http.ErrServerClosed's docs.
        - canceled
    nolintlint:
      require-explanation: true
      require-specific: true
  exclusions:
    presets:
      - comments
      - std-error-handling
    rules:
      - path: _test\.go$
        linters:
          - unparam

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/aleogr/marketplace
